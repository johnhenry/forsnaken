<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forsnaken (build your own)</title>
    <!--
      A small game, written as plain HTML: open this page and play it, or
      open it in a page builder that reads it (johnhenry/htmlbuilder:
      https://johnhenry.github.io/htmlbuilder/?project=https://johnhenry.github.io/forsnaken/builder.html)
      to rebuild it by drag and drop. The libraries are the scripts marked
      data-library, the meta tags point at their custom-elements.json
      manifests, and the templates are ready-made pieces. A browser ignores
      all three; nothing here depends on the builder.
    -->
    <meta name="htmlbuilder-manifest" content="domkit https://cdn.jsdelivr.net/gh/johnhenry/domkit@aca00df766ff879e6daa0a162beac4816c42178c/custom-elements.json">
    <meta name="htmlbuilder-manifest" content="forsnaken ./custom-elements.json">
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@aca00df766ff879e6daa0a162beac4816c42178c/src/frame-timer/global.mjs" data-library="domkit"></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@aca00df766ff879e6daa0a162beac4816c42178c/src/pixelable/pixel-canvas/global.mjs" data-library="domkit"></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@aca00df766ff879e6daa0a162beac4816c42178c/src/hot-key/global.mjs" data-library="domkit"></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@aca00df766ff879e6daa0a162beac4816c42178c/src/gamepad-input/global.mjs" data-library="domkit"></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@aca00df766ff879e6daa0a162beac4816c42178c/src/swipe-input/global.mjs" data-library="domkit"></script>
    <script type="module" src="./game/global.mjs" data-library="forsnaken"></script>
    <template data-snippet="Screen (pixel-canvas with a grid)"><pixel-canvas width="800" effects="grid(8, transparent, 3)"></pixel-canvas></template>
    <template data-snippet="Game board"><forsnaken-game width="100" height="50" background="#4e9a06" camouflage></forsnaken-game></template>
    <template data-snippet="Clock (24 fps)"><frame-timer fps="24"></frame-timer></template>
    <template data-snippet="Apples"><forsnaken-apple count="64" x-range="10,89" y-range="10,39"></forsnaken-apple></template>
    <template data-snippet="Wall (diagonal)"><forsnaken-wall x="1" y="1" x1="9" y1="9" shape="diagonal"></forsnaken-wall></template>
    <template data-snippet="Snake (green)"><forsnaken-snake id="green" color="#4e9a06" x="10" y="25" direction="right"><snake-brain-player id="green-player"><hot-key hotkey="arrowup" command="--up"></hot-key><hot-key hotkey="arrowdown" command="--down"></hot-key><hot-key hotkey="arrowleft" command="--left"></hot-key><hot-key hotkey="arrowright" command="--right"></hot-key><gamepad-input up="--up" down="--down" left="--left" right="--right"></gamepad-input></snake-brain-player></forsnaken-snake></template>
    <template data-snippet="Snake (steers itself)"><forsnaken-snake color="#ffffff" x="50" y="25" direction="right"><snake-brain-random></snake-brain-random></forsnaken-snake></template>
    <template data-snippet="Snake (mirrors green)"><forsnaken-snake id="mirror" color="#c4a000" x="99" y="49" direction="left" mirror="green"></forsnaken-snake></template>
    <template data-snippet="Brain: player (arrow keys and a controller inside)"><snake-brain-player><hot-key hotkey="arrowup" command="--up"></hot-key><hot-key hotkey="arrowdown" command="--down"></hot-key><hot-key hotkey="arrowleft" command="--left"></hot-key><hot-key hotkey="arrowright" command="--right"></hot-key><gamepad-input up="--up" down="--down" left="--left" right="--right"></gamepad-input></snake-brain-player></template>
    <template data-snippet="Brain: random"><snake-brain-random></snake-brain-random></template>
    <template data-snippet="Brain: greedy (seeks apples)"><snake-brain-greedy></snake-brain-greedy></template>
    <template data-snippet="Arrow keys (drop inside a player brain)"><hot-key hotkey="arrowup" command="--up"></hot-key><hot-key hotkey="arrowdown" command="--down"></hot-key><hot-key hotkey="arrowleft" command="--left"></hot-key><hot-key hotkey="arrowright" command="--right"></hot-key></template>
    <template data-snippet="Controller (drop inside a player brain)"><gamepad-input up="--up" down="--down" left="--left" right="--right"></gamepad-input></template>
    <template data-snippet="Swipes for green (wrap the board in it)"><swipe-input commandfor="green-player" up="--up" down="--down" left="--left" right="--right"></swipe-input></template>
    <style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: black; color: white; }
body { gap: 0.75rem; align-content: center; font: 14px/1.4 system-ui, sans-serif; }
swipe-input { inline-size: min(100%, 800px); }
pixel-canvas { display: block; }
p { margin: 0; opacity: 0.8; text-align: center; }
    </style>
  </head>
  <body>
    <swipe-input commandfor="green-player" up="--up" down="--down" left="--left" right="--right">
      <pixel-canvas width="800" effects="grid(8, transparent, 3)">
        <forsnaken-game width="100" height="50" background="#4e9a06" camouflage>
          <frame-timer fps="24"></frame-timer>
          <forsnaken-apple count="64" x-range="10,89" y-range="10,39"></forsnaken-apple>
          <forsnaken-snake id="green" color="#4e9a06" x="10" y="25" direction="right">
            <snake-brain-player id="green-player">
              <hot-key hotkey="arrowup" command="--up"></hot-key>
              <hot-key hotkey="arrowdown" command="--down"></hot-key>
              <hot-key hotkey="arrowleft" command="--left"></hot-key>
              <hot-key hotkey="arrowright" command="--right"></hot-key>
              <gamepad-input up="--up" down="--down" left="--left" right="--right"></gamepad-input>
            </snake-brain-player>
          </forsnaken-snake>
          <forsnaken-snake id="white" color="#ffffff" x="50" y="25" direction="right">
            <snake-brain-greedy></snake-brain-greedy>
          </forsnaken-snake>
        </forsnaken-game>
      </pixel-canvas>
    </swipe-input>
    <p>Arrow keys (or swipe) steer green: its player brain holds its controls. White's brain plays by itself. Swap brains to hand over control. Camouflage: the board turns the color of the snake that scored last, hiding it, so green starts out hidden. In an editor's preview, click the board first.</p>
  </body>
</html>
